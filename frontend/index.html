<!doctype html>
<!-- `lang` y `<title>` los fija React al resolver el idioma (src/i18n):
     aquí todavía no se sabe en qué idioma se va a pintar la página. El
     valor inicial es solo el que se ve durante el primer render. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tmux Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
