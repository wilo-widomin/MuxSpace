# Gate de calidad. Merge bloqueado si algo de esto se pone en rojo.
#
# Dos jobs en paralelo y deliberadamente simétricos con lo que se corre en
# local (ver el README): si el CI comprueba algo que no se puede reproducir en
# la máquina de uno, el CI deja de ser útil y pasa a ser un obstáculo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecución anterior: lo que
# importa es el estado del último commit, no la cola de los intermedios.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # La misma que el venv del despliegue: una diferencia de menor
          # aquí y el CI empieza a aprobar cosas que en producción fallan.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # tmux de verdad, no un mock: `test_tmux_service.py` habla con él por
      # un socket propio (`-L`). Sin esto sus 55 tests se saltarían en
      # silencio —el `skipif` los marca como omitidos, no como fallo— y nadie
      # se enteraría de que la mitad con más riesgo del módulo no se prueba.
      - name: Instalar tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: ruff
        run: ruff check backend/

      # `--cov-fail-under=60` con la cobertura real en el 76% de las
      # sentencias de código fuente (los tests se excluyen en la config de
      # coverage: medir la cobertura de los tests infla el número sin decir
      # nada). El margen es a propósito: los endpoints `async` no se miden
      # bien —coverage deja de trazar la corrutina en cuanto se suspende, ver
      # docs/historias/contexto-tecnico.md— y subir el listón chocaría con ese
      # techo artificial, no con la calidad de las pruebas.
      - name: pytest
        run: pytest --cov=backend --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `bun`, nunca `setup-node` + npm: el lockfile del proyecto es
      # `bun.lock` y npm generaría otro distinto (ver contexto-tecnico.md).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Caché de bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Instalar dependencias
        working-directory: frontend
        # `--frozen-lockfile`: si alguien tocó package.json sin actualizar el
        # lockfile, el CI lo dice aquí en vez de instalar otra cosa.
        run: bun install --frozen-lockfile

      - name: eslint
        working-directory: frontend
        run: bun run lint

      # Entra en el gate ahora que el repo está formateado entero. Antes no
      # podía: el `format:check` salía en rojo por ~600 líneas heredadas, y un
      # paso que falla siempre acaba ignorándose o desactivándose.
      - name: prettier
        working-directory: frontend
        run: bun run format:check

      # El paso de vitest no existe todavía y NO se disfraza de comprobación
      # que pasa siempre: se detecta si el script `test` existe y, si no, el
      # paso se salta de forma visible en el log. Lo activa US-017 sin tocar
      # este archivo, con solo añadir el script a package.json.
      - name: ¿Hay vitest?
        id: detectar-vitest
        working-directory: frontend
        run: |
          if bun -e 'const s=require("./package.json").scripts||{};process.exit(s.test?0:1)'; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin script \`test\` en frontend/package.json: vitest se omite. Lo activa US-017."
          fi

      - name: vitest
        if: steps.detectar-vitest.outputs.hay == 'true'
        working-directory: frontend
        run: bun run test

      - name: build
        working-directory: frontend
        run: bun run build

      # Como ERROR, no como aviso (US-022 lo dejó sin avisos para que esto
      # fuera posible): una clave que falte degrada la interfaz en silencio en
      # los otros cinco idiomas, que es justo lo que nadie va a ver probando.
      - name: check-i18n
        working-directory: frontend
        run: bun run check-i18n

  # Los E2E van en su propio job y no dentro de `frontend` por dos motivos:
  # necesitan `tmux` y un navegador de ~120 MB (el job de frontend no quiere
  # ninguno de los dos), y así un fallo dice "se rompió el recorrido", no "se
  # rompió el frontend".
  #
  # Se dejaron fuera del CI en US-024 hasta tener el dato de cuánto tardan.
  # El dato: **~36 s** los 27 tests, más la descarga del navegador, que se
  # cachea. Con eso, meterlos sale a cuenta: un test de extremo a extremo que
  # solo corre cuando alguien se acuerda es un test que se pudre.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # tmux de verdad: el andamiaje levanta su propio servidor con `-L` y
      # crea sesiones reales. Sin el paquete, el arranque falla en su
      # comprobación de aislamiento, que es lo que tiene que hacer.
      - name: Instalar tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Instalar dependencias del backend
        run: pip install -r backend/requirements.txt

      # El andamiaje arranca el backend con `backend/venv/bin/python`. En el
      # CI no hay venv —las dependencias van al Python del runner—, así que se
      # crea el enlace que espera. Es una línea aquí o una rama especial "si
      # estás en CI" en el código del arranque; mejor aquí, donde se ve.
      - name: Enlazar el venv que espera el arranque del E2E
        run: |
          mkdir -p backend/venv/bin
          ln -sf "$(command -v python)" backend/venv/bin/python

      - name: Caché de bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: bun install --frozen-lockfile

      # La caché del navegador se ata a la versión de Playwright del lockfile:
      # con una clave fija, actualizar Playwright reutilizaría un navegador
      # incompatible y el fallo no apuntaría a la actualización.
      - name: Caché del navegador
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      # Solo chromium: es el único proyecto configurado y bajar los tres
      # motores serían ~1,3 GB en vez de ~120 MB.
      #
      # `--with-deps` necesita `apt` y en algunas máquinas falla por
      # repositorios ajenos al proyecto; en el runner de GitHub las
      # bibliotecas del sistema ya están, así que se instala el navegador a
      # secas. Si algún día faltara alguna, el error lo dirá con nombre y
      # apellidos.
      - name: Instalar chromium
        working-directory: frontend
        run: bunx playwright install chromium

      - name: E2E
        working-directory: frontend
        run: bun run test:e2e

      # Solo cuando algo falla: en verde no interesan y ocupan. Sin esto, un
      # rojo en el CI obliga a reproducirlo en local para ver la traza.
      - name: Guardar las trazas del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: |
            frontend/test-results/
            frontend/e2e/.tmp/
          retention-days: 7
