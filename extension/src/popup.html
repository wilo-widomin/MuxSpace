<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MuxSpace</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <header>
      <span class="marca">
        <img src="../icons/logo.png" alt="" width="22" height="22" />
        <strong>Proyectos</strong>
      </span>
      <button id="refrescar" type="button" title="Volver a pedir la lista al panel">
        Refrescar
      </button>
    </header>
    <input
      id="buscar"
      type="search"
      autofocus
      autocomplete="off"
      placeholder="Buscar proyecto"
      aria-label="Buscar proyecto"
    />
    <p id="aviso" hidden></p>
    <ul id="proyectos"></ul>
    <footer>
      <button id="opciones" type="button">Opciones</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
